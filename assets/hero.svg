<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Eachann">
  <defs>
    <clipPath id="frame"><rect width="1200" height="620" rx="20"/></clipPath>
    <clipPath id="cStripe"><rect x="1030" y="60" width="120" height="120"/></clipPath>
    <clipPath id="cEye"><rect x="770" y="450" width="120" height="120"/></clipPath>
  </defs>
  <style>
    .sans{font-family:"Helvetica Neue",Helvetica,ui-sans-serif,-apple-system,Arial,sans-serif}
    .half{transform-origin:765px 185px;animation:half 6s cubic-bezier(.75,0,.2,1) infinite}
    .quad{transform-origin:960px 120px;animation:quad 8s cubic-bezier(.75,0,.2,1) infinite}
    .stripes{animation:stripes 2.4s linear infinite}
    .tri{transform-origin:1090px 254px;animation:tri 6s cubic-bezier(.75,0,.2,1) infinite;animation-delay:-1.5s}
    .ball{animation:ball 1.6s infinite}
    .shadow{transform-origin:700px 556px;animation:shadow 1.6s infinite}
    .dot{animation:dot 1.8s ease-in-out infinite}
    .eye{transform-origin:830px 510px;animation:eye 4s cubic-bezier(.75,0,.2,1) infinite}
    .slide{animation:slide 4s cubic-bezier(.75,0,.2,1) infinite}
    .bar{transform-origin:72px 200px;transform:scaleX(0);animation:bar 1.2s cubic-bezier(.75,0,.2,1) .2s forwards}
    .s1{transform-origin:86px 426px;animation:rot90 4s cubic-bezier(.75,0,.2,1) infinite}
    .s2{transform-origin:136px 426px;animation:pop 4s cubic-bezier(.75,0,.2,1) infinite;animation-delay:-1.3s}
    .s3{transform-origin:186px 428px;animation:rot120 4s cubic-bezier(.75,0,.2,1) infinite;animation-delay:-2.6s}
    @keyframes half{0%,35%{transform:rotate(0)}50%,85%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
    @keyframes quad{0%,18%{transform:rotate(0)}25%,43%{transform:rotate(90deg)}50%,68%{transform:rotate(180deg)}75%,93%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
    @keyframes stripes{to{transform:translate(-40px,40px)}}
    @keyframes tri{0%,30%{transform:rotate(0)}45%,63%{transform:rotate(120deg)}78%,96%{transform:rotate(240deg)}100%{transform:rotate(360deg)}}
    @keyframes ball{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.45,0,.9,.5)}50%{transform:translateY(176px);animation-timing-function:cubic-bezier(.1,.5,.55,1)}100%{transform:translateY(0)}}
    @keyframes shadow{0%,100%{transform:scaleX(.4);opacity:.25;animation-timing-function:cubic-bezier(.45,0,.9,.5)}50%{transform:scaleX(1);opacity:.6;animation-timing-function:cubic-bezier(.1,.5,.55,1)}}
    @keyframes dot{0%,100%{transform:translateY(22px)}50%{transform:translateY(-22px)}}
    @keyframes eye{0%,40%{transform:scaleY(1)}48%,52%{transform:scaleY(.06)}60%,100%{transform:scaleY(1)}}
    @keyframes slide{0%,10%{transform:translateX(0)}45%,60%{transform:translateX(150px)}95%,100%{transform:translateX(0)}}
    @keyframes bar{to{transform:scaleX(1)}}
    @keyframes rot90{0%,60%{transform:rotate(0)}80%,100%{transform:rotate(90deg)}}
    @keyframes rot120{0%,60%{transform:rotate(0)}80%,100%{transform:rotate(120deg)}}
    @keyframes pop{0%,60%{transform:scale(1)}70%{transform:scale(.55)}80%,100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.bar{transform:none}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="620" fill="#EFE9DC"/>

    <!-- title block -->
    <rect class="bar" x="72" y="192" width="132" height="16" fill="#E2412E"/>
    <text class="sans" x="62" y="352" font-size="132" font-weight="800" letter-spacing="-6" fill="#141414">Eachann</text>
    <g>
      <rect class="s1" x="72" y="412" width="28" height="28" fill="#2547C8"/>
      <circle class="s2" cx="136" cy="426" r="14" fill="#F4B728"/>
      <path class="s3" d="M186 411l16 26h-32Z" fill="#E2412E"/>
    </g>

    <!-- tile 1: big yellow, rotating half-disc -->
    <rect x="640" y="60" width="250" height="250" fill="#F4B728"/>
    <path class="half" d="M670 185a95 95 0 0 1 190 0Z" fill="#E2412E"/>
    <circle cx="765" cy="185" r="14" fill="#141414"/>

    <!-- tile 2: blue, stepping quarter circle -->
    <rect x="900" y="60" width="120" height="120" fill="#2547C8"/>
    <path class="quad" d="M900 60h120a120 120 0 0 1-120 120Z" fill="#EFE9DC"/>

    <!-- tile 3: black, sliding stripes -->
    <rect x="1030" y="60" width="120" height="120" fill="#141414"/>
    <g clip-path="url(#cStripe)">
      <g class="stripes" stroke="#EFE9DC" stroke-width="12">
        <path d="M1000 140l80-80M1000 180l120-120M1000 220l160-160M1020 240l160-160M1060 240l120-120M1100 240l80-80M1000 100l40-40"/>
      </g>
    </g>

    <!-- tile 4: cream, square ⇄ circle -->
    <rect x="900" y="190" width="120" height="120" fill="#DCD3C1"/>
    <rect x="915" y="205" width="90" height="90" fill="#E2412E">
      <animate attributeName="rx" values="0;45;45;0;0" keyTimes="0;.2;.5;.7;1" dur="5s" calcMode="spline" keySplines=".75 0 .2 1;0 0 1 1;.75 0 .2 1;0 0 1 1" repeatCount="indefinite"/>
    </rect>

    <!-- tile 5: yellow, rotating triangle -->
    <rect x="1030" y="190" width="120" height="120" fill="#F4B728"/>
    <path class="tri" d="M1090 214l40 60h-80Z" fill="#141414"/>

    <!-- tile 6: tall red, bouncing ball -->
    <rect x="640" y="320" width="120" height="250" fill="#E2412E"/>
    <ellipse class="shadow" cx="700" cy="556" rx="26" ry="4" fill="#141414"/>
    <circle class="ball" cx="700" cy="356" r="24" fill="#EFE9DC"/>

    <!-- tile 7: wide black, dot wave -->
    <rect x="770" y="320" width="380" height="120" fill="#141414"/>
    <g fill="#EFE9DC">
      <circle class="dot" cx="810" cy="380" r="13"/>
      <circle class="dot" style="animation-delay:-.18s" cx="860" cy="380" r="13"/>
      <circle class="dot" style="animation-delay:-.36s" cx="910" cy="380" r="13"/>
      <circle class="dot" style="animation-delay:-.54s" cx="960" cy="380" r="13" fill="#F4B728"/>
      <circle class="dot" style="animation-delay:-.72s" cx="1010" cy="380" r="13"/>
      <circle class="dot" style="animation-delay:-.9s" cx="1060" cy="380" r="13"/>
      <circle class="dot" style="animation-delay:-1.08s" cx="1110" cy="380" r="13"/>
    </g>

    <!-- tile 8: blue, blinking eye -->
    <rect x="770" y="450" width="120" height="120" fill="#2547C8"/>
    <g clip-path="url(#cEye)">
      <g class="eye">
        <circle cx="830" cy="510" r="40" fill="#EFE9DC"/>
        <circle cx="830" cy="510" r="17" fill="#141414"/>
      </g>
    </g>

    <!-- tile 9: cream, sliding block -->
    <rect x="900" y="450" width="250" height="120" fill="#DCD3C1"/>
    <path d="M920 510H1130" stroke="#141414" stroke-width="3"/>
    <rect class="slide" x="920" y="480" width="60" height="60" fill="#2547C8"/>
  </g>
</svg>
