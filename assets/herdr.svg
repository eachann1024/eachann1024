<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Goose Herdr">
  <defs>
    <clipPath id="hbh-frame"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="hbh-session-clip"><rect x="840" y="215" width="150" height="150"/></clipPath>
  </defs>
  <style>
    .hbh-type{font-family:"Helvetica Neue",Helvetica,ui-sans-serif,-apple-system,Arial,sans-serif}
    .hbh-bar{transform-origin:72px 132px;transform:scaleX(0);animation:hbh-enter 1.2s cubic-bezier(.75,0,.2,1) .2s forwards}
    .hbh-pane-left{transform-origin:694px 130px;animation:hbh-pane-left 5.6s cubic-bezier(.75,0,.2,1) infinite}
    .hbh-pane-right{transform-origin:816px 130px;animation:hbh-pane-right 5.6s cubic-bezier(.75,0,.2,1) infinite}
    .hbh-cursor{animation:hbh-cursor 2.4s cubic-bezier(.75,0,.2,1) infinite}
    .hbh-turn{transform-origin:755px 290px;animation:hbh-turn 8s cubic-bezier(.75,0,.2,1) -.8s infinite}
    .hbh-session{animation:hbh-session 5.6s cubic-bezier(.75,0,.2,1) -1.4s infinite}
    .hbh-link{animation:hbh-link 4.8s cubic-bezier(.75,0,.2,1) -.7s infinite}
    @keyframes hbh-enter{to{transform:scaleX(1)}}
    @keyframes hbh-pane-left{0%,22%,100%{transform:scaleX(1)}42%,74%{transform:scaleX(.55)}}
    @keyframes hbh-pane-right{0%,22%,100%{transform:scaleX(1)}42%,74%{transform:scaleX(1.58)}}
    @keyframes hbh-cursor{0%,40%,100%{opacity:1}48%,70%{opacity:0}}
    @keyframes hbh-turn{0%,18%{transform:rotate(0deg)}25%,43%{transform:rotate(90deg)}50%,68%{transform:rotate(180deg)}75%,93%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
    @keyframes hbh-session{0%,20%,100%{transform:translateY(0)}42%,74%{transform:translateY(-58px)}}
    @keyframes hbh-link{0%,20%,100%{transform:translateY(0)}44%,72%{transform:translateY(160px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.hbh-bar{transform:none}}
  </style>
  <g clip-path="url(#hbh-frame)">
    <rect width="1200" height="420" fill="#EFE9DC"/>
    <rect class="hbh-bar" x="72" y="124" width="132" height="16" fill="#E2412E"/>
    <text class="hbh-type" x="62" y="252" font-size="96" font-weight="800" letter-spacing="-4.5" fill="#141414">Goose Herdr</text>
    <rect x="72" y="308" width="28" height="28" fill="#2547C8"/>
    <circle cx="136" cy="322" r="14" fill="#F4B728"/>
    <path d="M186 307l16 26h-32Z" fill="#E2412E"/>
    <rect x="680" y="55" width="150" height="150" fill="#141414"/>
    <rect class="hbh-pane-left" x="694" y="69" width="65" height="122" fill="#2547C8"/>
    <rect class="hbh-pane-right" x="767" y="69" width="49" height="122" fill="#F4B728"/>
    <rect x="840" y="55" width="150" height="150" fill="#2547C8"/>
    <path d="M866 166h98" stroke="#EFE9DC" stroke-width="8"/>
    <rect class="hbh-cursor" x="866" y="93" width="38" height="54" fill="#EFE9DC"/>
    <rect x="1000" y="55" width="150" height="150" fill="#E2412E"/>
    <rect x="680" y="215" width="150" height="150" fill="#F4B728"/>
    <path class="hbh-turn" d="M755 290v-57a57 57 0 0 1 57 57Z" fill="#141414"/>
    <circle cx="755" cy="290" r="10" fill="#EFE9DC"/>
    <rect x="840" y="215" width="150" height="150" fill="#DCD3C1"/>
    <g clip-path="url(#hbh-session-clip)">
      <g class="hbh-session">
        <rect x="863" y="253" width="104" height="38" fill="#141414"/>
        <rect x="863" y="311" width="104" height="38" fill="#E2412E"/>
        <rect x="863" y="369" width="104" height="38" fill="#2547C8"/>
      </g>
    </g>
    <rect x="1000" y="215" width="150" height="150" fill="#141414"/>
    <path d="M1075 130V290" stroke="#EFE9DC" stroke-width="6"/>
    <rect x="1043" y="98" width="64" height="64" fill="#EFE9DC"/>
    <rect x="1043" y="258" width="64" height="64" fill="#2547C8"/>
    <circle class="hbh-link" cx="1075" cy="130" r="18" fill="#F4B728"/>
  </g>
</svg>
