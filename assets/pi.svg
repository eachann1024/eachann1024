<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Pi">
  <defs>
    <clipPath id="pbh-frame"><rect width="1200" height="420" rx="20"/></clipPath>
  </defs>
  <style>
    .pbh-type{font-family:"Helvetica Neue",Helvetica,ui-sans-serif,-apple-system,Arial,sans-serif}
    .pbh-bar{transform-origin:72px 132px;transform:scaleX(0);animation:pbh-enter 1.2s cubic-bezier(.75,0,.2,1) .2s forwards}
    .pbh-route{animation:pbh-route 6.4s cubic-bezier(.75,0,.2,1) infinite}
    .pbh-reply-top{transform-origin:710px 125px;animation:pbh-reply-top 5.6s cubic-bezier(.75,0,.2,1) -1.4s infinite}
    .pbh-reply-middle{transform-origin:710px 175px;animation:pbh-reply-middle 5.6s cubic-bezier(.75,0,.2,1) -1.4s infinite}
    .pbh-reply-bottom{transform-origin:710px 225px;animation:pbh-reply-bottom 5.6s cubic-bezier(.75,0,.2,1) -1.4s infinite}
    .pbh-mini{transform-origin:1030px 175px;animation:pbh-mini 5.6s cubic-bezier(.75,0,.2,1) -.7s infinite}
    @keyframes pbh-enter{to{transform:scaleX(1)}}
    @keyframes pbh-route{0%,10%{transform:translate(0,0);opacity:1}28%{transform:translate(50px,0);opacity:1}46%{transform:translate(50px,-60px);opacity:1}64%,80%{transform:translate(142px,-60px);opacity:1}88%,92%{transform:translate(142px,-60px);opacity:0}93%,94%{transform:translate(0,0);opacity:0}100%{transform:translate(0,0);opacity:1}}
    @keyframes pbh-reply-top{0%,22%,100%{transform:translateY(0) scaleX(1);opacity:1}44%,76%{transform:translateY(50px) scaleX(.65);opacity:0}}
    @keyframes pbh-reply-middle{0%,22%,100%{transform:scaleX(1)}44%,76%{transform:scaleX(.65)}}
    @keyframes pbh-reply-bottom{0%,22%,100%{transform:translateY(0) scaleX(1);opacity:1}44%,76%{transform:translateY(-50px) scaleX(.65);opacity:0}}
    @keyframes pbh-mini{0%,22%,100%{transform:translate(0,0) scale(1)}44%,76%{transform:translate(48px,48px) scale(.4)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.pbh-bar{transform:none}}
  </style>
  <g clip-path="url(#pbh-frame)">
    <rect width="1200" height="420" fill="#EFE9DC"/>
    <rect class="pbh-bar" x="72" y="124" width="104" height="16" fill="#E2412E"/>
    <text class="pbh-type" x="62" y="263" font-size="128" font-weight="800" letter-spacing="-6" fill="#141414">Pi</text>
    <rect x="72" y="308" width="28" height="28" fill="#2547C8"/>
    <circle cx="136" cy="322" r="14" fill="#F4B728"/>
    <path d="M186 307l16 26h-32Z" fill="#E2412E"/>
    <rect x="430" y="55" width="240" height="240" fill="#2547C8"/>
    <path d="M462 175h70v-60h92M532 175v60h92" fill="none" stroke="#EFE9DC" stroke-width="12"/>
    <rect x="608" y="99" width="32" height="32" fill="#E2412E"/>
    <circle cx="624" cy="235" r="16" fill="#EFE9DC"/>
    <circle class="pbh-route" cx="482" cy="175" r="16" fill="#F4B728"/>
    <rect x="680" y="55" width="240" height="240" fill="#F4B728"/>
    <rect class="pbh-reply-top" x="710" y="115" width="180" height="20" fill="#141414"/>
    <rect class="pbh-reply-middle" x="710" y="165" width="180" height="20" fill="#141414"/>
    <rect class="pbh-reply-bottom" x="710" y="215" width="140" height="20" fill="#141414"/>
    <rect x="930" y="55" width="240" height="240" fill="#E2412E"/>
    <g class="pbh-mini">
      <rect x="950" y="95" width="160" height="160" fill="#EFE9DC"/>
      <rect x="974" y="119" width="48" height="16" fill="#141414"/>
    </g>
    <g class="pbh-type" font-size="36" font-weight="800" letter-spacing="-1.2" fill="#141414">
      <text x="430" y="347">Jev Route</text>
      <text x="680" y="347">Jev Reply</text>
      <text x="930" y="347">Mini Mode</text>
    </g>
  </g>
</svg>
