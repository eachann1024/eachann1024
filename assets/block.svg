<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Block — Pure Go + MyGo 原生跨平台块级 Markdown 笔记" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="frB"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>

  .serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","STSong","Noto Serif SC",serif}
  .sans{font-family:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",sans-serif}
  .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}

  .bk-drag{animation:bk-drag 7s cubic-bezier(.22,1,.36,1) infinite}
  .bk-rule{transform-origin:92px 218px;animation:bk-rule 7s cubic-bezier(.22,1,.36,1) infinite}
  .bk-caret{animation:bk-caret 1.2s steps(1,end) infinite}
  @keyframes bk-drag{0%,16%,100%{transform:translateY(0)}44%,72%{transform:translateY(48px)}}
  @keyframes bk-rule{0%,28%,82%,100%{transform:scaleX(0);opacity:0}44%,70%{transform:scaleX(1);opacity:1}}
  @keyframes bk-caret{0%,49%{opacity:1}50%,100%{opacity:0}}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frB)">
    <rect width="1200" height="340" fill="#f3f1eb"/>
    <!-- Left Animated Architectural Editor Plate -->
    <rect x="40" y="34" width="600" height="272" rx="10" fill="#faf9f5" stroke="#dcd6c8" stroke-width="1.5"/>
    <!-- Heading & resting markdown lines -->
    <rect x="86" y="72" width="154" height="14" rx="3" fill="#191b20"/>
    <rect x="86" y="102" width="388" height="7" rx="3.5" fill="#c7c0b3"/>
    <rect x="86" y="120" width="310" height="7" rx="3.5" fill="#d7d1c4"/>

    <!-- Active Modular Block Gliding -->
    <g class="bk-drag">
      <rect x="74" y="140" width="468" height="58" rx="8" fill="#191b20"/>
      <g fill="#3b69c8">
        <circle cx="94" cy="161" r="2.3"/><circle cx="102" cy="161" r="2.3"/>
        <circle cx="94" cy="169" r="2.3"/><circle cx="102" cy="169" r="2.3"/>
        <circle cx="94" cy="177" r="2.3"/><circle cx="102" cy="177" r="2.3"/>
      </g>
      <rect x="122" y="158" width="218" height="7.5" rx="3.8" fill="#f3f1eb" opacity=".94"/>
      <rect class="bk-caret" x="348" y="153" width="2.5" height="17" rx="1" fill="#82a9f7"/>
      <rect x="122" y="175" width="144" height="5.5" rx="2.8" fill="#6b7385"/>
    </g>

    <!-- Cobalt Insertion Guide -->
    <rect class="bk-rule" x="92" y="218" width="460" height="3" rx="1.5" fill="#3b69c8"/>
    <rect x="86" y="256" width="292" height="7" rx="3.5" fill="#cfc8ba"/>

    <!-- Vertical Divider -->
    <line x1="672" y1="42" x2="672" y2="298" stroke="#dcd6c8" stroke-width="1.2"/>

    <!-- Right Editorial Copy -->
    <defs><clipPath id="icBlk"><rect x="708" y="48" width="52" height="52" rx="12"/></clipPath></defs><image href="data:image/png;base64," x="708" y="48" width="52" height="52" clip-path="url(#icBlk)" preserveAspectRatio="xMidYMid slice"/><rect x="708" y="48" width="52" height="52" rx="12" fill="none" stroke="#dcd6c8" stroke-width="1"/>
    <text class="serif" x="778" y="88" font-size="44" font-weight="700" letter-spacing="-0.8" fill="#191b20">Block</text>
    <g transform="translate(1148 72) scale(1.15)" fill="none" stroke="#676258" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-5 5 L5 -5 M-2 -5 H5 V2"/></g>

    <text class="sans" x="708" y="148" font-size="20.5" font-weight="600" fill="#191b20">Pure Go + MyGo 原生块级 Markdown 笔记</text>
    <text class="sans" x="708" y="186" font-size="18" fill="#4a463f">直读本地 .md 文件夹，零私有格式绑定。</text>
    <text class="sans" x="708" y="218" font-size="18" fill="#4a463f">支持块拖拽、Mermaid / LaTeX 与 CLI AI。</text>

    <line x1="708" y1="252" x2="1156" y2="252" stroke="#dcd6c8" stroke-width="1.2"/>
    <text class="mono" x="708" y="286" font-size="16" font-weight="500" fill="#244899">block.cooool.top</text>
    <text class="mono" x="1156" y="286" text-anchor="end" font-size="15.5" fill="#676258">Pure Go · MyGo</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="17.25" fill="none" stroke="#dcd6c8" stroke-width="1.5"/>
</svg>
