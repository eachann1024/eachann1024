<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Thinkly">
  <defs>
    <clipPath id="nbh-frame"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="nbh-flip-clip"><rect x="1000" y="215" width="150" height="150"/></clipPath>
  </defs>
  <style>
    .nbh-type{font-family:"Helvetica Neue",Helvetica,ui-sans-serif,-apple-system,Arial,sans-serif}
    .nbh-bar{transform-origin:72px 132px;transform:scaleX(0);animation:nbh-enter 1.2s cubic-bezier(.75,0,.2,1) .2s forwards}
    .nbh-line{transform-origin:744px 0px;animation:nbh-write 6s cubic-bezier(.75,0,.2,1) infinite}
    .nbh-line-two{animation-name:nbh-write-two}
    .nbh-line-three{animation-name:nbh-write-three}
    .nbh-line-four{animation-name:nbh-write-four}
    .nbh-idea{transform-origin:1075px 120px;animation:nbh-idea 4.8s cubic-bezier(.75,0,.2,1) -.8s infinite}
    .nbh-flip{transform-origin:1075px 290px;animation:nbh-flip 6s cubic-bezier(.75,0,.2,1) -1.6s infinite}
    @keyframes nbh-enter{to{transform:scaleX(1)}}
    @keyframes nbh-write{0%,7%{transform:scaleX(.12)}18%,78%{transform:scaleX(1)}92%,100%{transform:scaleX(.12)}}
    @keyframes nbh-write-two{0%,17%{transform:scaleX(.12)}28%,78%{transform:scaleX(1)}92%,100%{transform:scaleX(.12)}}
    @keyframes nbh-write-three{0%,27%{transform:scaleX(.12)}38%,78%{transform:scaleX(1)}92%,100%{transform:scaleX(.12)}}
    @keyframes nbh-write-four{0%,37%{transform:scaleX(.12)}48%,78%{transform:scaleX(1)}92%,100%{transform:scaleX(.12)}}
    @keyframes nbh-idea{0%,24%,100%{transform:scale(.64)}40%,78%{transform:scale(1)}}
    @keyframes nbh-flip{0%,32%{transform:rotate(0deg)}48%,82%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.nbh-bar{transform:none}}
  </style>
  <g clip-path="url(#nbh-frame)">
    <rect width="1200" height="420" fill="#EFE9DC"/>
    <rect class="nbh-bar" x="72" y="124" width="132" height="16" fill="#E2412E"/>
    <text class="nbh-type" x="62" y="257" font-size="112" font-weight="800" letter-spacing="-5" fill="#141414">Thinkly</text>
    <rect x="72" y="308" width="28" height="28" fill="#2547C8"/>
    <circle cx="136" cy="322" r="14" fill="#F4B728"/>
    <path d="M186 307l16 26h-32Z" fill="#E2412E"/>
    <rect x="680" y="55" width="310" height="310" fill="#F4B728"/>
    <rect x="718" y="88" width="234" height="244" fill="#EFE9DC"/>
    <rect x="898" y="88" width="54" height="54" fill="#E2412E"/>
    <g fill="#141414">
      <rect class="nbh-line" x="744" y="153" width="180" height="16"/>
      <rect class="nbh-line nbh-line-two" x="744" y="191" width="154" height="16"/>
      <rect class="nbh-line nbh-line-three" x="744" y="229" width="180" height="16"/>
      <rect class="nbh-line nbh-line-four" x="744" y="267" width="110" height="16" fill="#2547C8"/>
    </g>
    <rect x="1000" y="55" width="150" height="150" fill="#2547C8"/>
    <circle class="nbh-idea" cx="1075" cy="120" r="43" fill="#F4B728"/>
    <rect x="1061" y="171" width="28" height="12" fill="#EFE9DC"/>
    <rect x="1000" y="215" width="150" height="150" fill="#E2412E"/>
    <g clip-path="url(#nbh-flip-clip)">
      <path class="nbh-flip" d="M1017 290a58 58 0 0 1 116 0Z" fill="#EFE9DC"/>
      <circle cx="1075" cy="290" r="12" fill="#141414"/>
    </g>
  </g>
</svg>
