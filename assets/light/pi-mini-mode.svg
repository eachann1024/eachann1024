<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="pi-mini-mode — Pi 紧凑模式扩展" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="frPML"><rect x="0" y="0" width="1200" height="176" rx="18"/></clipPath>
  </defs>
  <style>

  .serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","STSong","Noto Serif SC",serif}
  .sans{font-family:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",sans-serif}
  .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}

  .pm-n1{animation:pm-fold 7.5s cubic-bezier(.22,1,.36,1) infinite}
  .pm-n2{animation:pm-fold 7.5s cubic-bezier(.22,1,.36,1) .14s infinite}
  .pm-n3{animation:pm-fold 7.5s cubic-bezier(.22,1,.36,1) .28s infinite}
  .pm-bar{transform-origin:756px 118px;animation:pm-bar 7.5s cubic-bezier(.22,1,.36,1) infinite}
  @keyframes pm-fold{0%,16%,100%{opacity:.72;transform:translateY(0)}44%,76%{opacity:.12;transform:translateY(26px)}}
  @keyframes pm-bar{0%,22%,100%{transform:scaleX(.86)}46%,76%{transform:scaleX(1)}}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frPML)">
    <rect width="1200" height="176" fill="#f3f1eb"/>
    <text class="serif" x="46" y="56" font-size="31" font-weight="700" letter-spacing="-0.4" fill="#191b20">pi-mini-mode</text>
    <rect x="516" y="31" width="166" height="30" rx="15" fill="#e3eaf8"/>
    <text class="mono" x="599" y="51" text-anchor="middle" font-size="13.5" font-weight="500" fill="#244899">7.7K+ downloads</text>

    <text class="sans" x="46" y="96" font-size="18" fill="#4a463f">思考与工具调用折叠为过程树，紧凑单行页脚与图片预览。</text>

    <rect x="46" y="116" width="366" height="34" rx="8" fill="#eae6dc"/>
    <text class="mono" x="62" y="138" font-size="14.5" fill="#191b20">pi install npm:@each1024/pi-mini-mode</text>

    <line x1="712" y1="28" x2="712" y2="148" stroke="#dcd6c8" stroke-width="1.2"/>
    <g transform="translate(1152 38) scale(1.0)" fill="none" stroke="#676258" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-5 5 L5 -5 M-2 -5 H5 V2"/></g>

    <rect class="pm-n1" x="756" y="50" width="320" height="6" rx="3" fill="#b4ada0"/>
    <rect class="pm-n2" x="756" y="66" width="256" height="6" rx="3" fill="#b4ada0" opacity=".8"/>
    <rect class="pm-n3" x="756" y="82" width="290" height="6" rx="3" fill="#cfc8ba"/>

    <g class="pm-bar">
      <rect x="756" y="106" width="368" height="28" rx="6" fill="#191b20"/>
      <circle cx="776" cy="120" r="4.5" fill="#3b69c8"/>
      <rect x="792" y="117" width="114" height="6" rx="3" fill="#f3f1eb" opacity=".92"/>
      <rect x="1044" y="117" width="62" height="6" rx="3" fill="#82a9f7"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="174.5" rx="17.25" fill="none" stroke="#dcd6c8" stroke-width="1.5"/>
</svg>
