<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="pi-final-model — Pi 最终模型提炼扩展" preserveAspectRatio="xMidYMid meet">
  <defs>
