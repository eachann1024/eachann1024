name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: eachann1024
          svg_out_path: dist/github-contribution-grid-snake.svg

      - name: Save generated resource on main
        run: |
          cp dist/github-contribution-grid-snake.svg github-contribution-grid-snake.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- github-contribution-grid-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
